<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wynajem Miejsc Garażowych</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Globalne ustawienia */
      body {
        font-family: "Arial", sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 0;
        color: #333;
      }

      /* Nagłówek strony */
      header {
        background-color: #007bff;
        color: white;
        padding: 30px 20px;
        text-align: center;
      }

      header h1 {
        font-size: 36px;
        margin: 0;
      }

      header p {
        font-size: 18px;
        margin-top: 10px;
        font-style: italic;
      }

      /* Sekcja oferty */
      section {
        padding: 40px 20px;
        text-align: center;
        background-color: #ffffff;
        margin: 20px 0;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      section h2 {
        font-size: 28px;
        color: #007bff;
        margin-bottom: 20px;
      }

      section p {
        font-size: 18px;
        color: #555;
        line-height: 1.6;
      }

      /* Stopka */
      footer {
        background-color: #343a40;
        color: white;
        text-align: center;
        padding: 20px;
        position: fixed;
        width: 100%;
        bottom: 0;
      }

      /* Responsywność */
      @media (max-width: 768px) {
        header h1 {
          font-size: 28px;
        }

        header p {
          font-size: 16px;
        }

        section h2 {
          font-size: 24px;
        }

        section p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wynajem Miejsc Garażowych</h1>
      <p>Bezpieczne i wygodne miejsca parkingowe w Twojej okolicy</p>
    </header>

    <section>
      <h2>Nasza Oferta</h2>
      <p>
        Oferujemy wynajem miejsc garażowych w różnych lokalizacjach. Wybierz
        odpowiednią opcję dla siebie i zarezerwuj miejsce online.
      </p>
    </section>

    <footer>
      <p>&copy; 2025 Wynajem Miejsc Garażowych. Wszelkie prawa zastrzeżone.</p>
    </footer>
  </body>
</html>
