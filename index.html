<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wynajem miejsc samochodowych</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styl.css" />
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>
    <style>
      .tab-pane.fade {
        height: 80vh;
      }
      header {
        height: 20vh;
      }
      main {
        height: 80vh;
      }
      body {
        background-color: #1a1a1a;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      /* Styl jumbotronu */
      .jumbotron {
        background-color: #333;
        color: #fff;
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 3rem;
      }

      /* Nawigacja */
      .nav-tabs .nav-link {
        color: #bbb;
        background: #2a2a2a;
        border: none;
        transition: all 0.3s ease-in-out;
        border-radius: 10px 10px 0 0;
      }

      .nav-tabs .nav-link:hover,
      .nav-tabs .nav-link.active {
        background: #444;
        color: #fff;
      }

      /* Styl ramek iframe */
      iframe {
        width: 100%;

        border-radius: 15px;
        border: none;
        box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.1);
        height: auto; /* Wysokość dostosowuje się do zawartości */
        border: none; /* Ukrycie obramowania */
        overflow: hidden; /* Ukrycie suwaka */
      }

      /* Przyciski */
      .btn {
        background: #444;
        color: #fff;
        border-radius: 10px;
        transition: 0.3s;
      }

      .btn:hover {
        background: #666;
        color: #fff;
      }

      /* Dodatkowe efekty hover */
      .card {
        background: #2a2a2a;
        border-radius: 15px;
        box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.1);
        transition: transform 0.3s;
      }

      .card:hover {
        transform: scale(1.03);
      }
      #kontener {
        min-height: 100vh;
      }

      /* Responsywność na mniejsze ekrany */
      @media (max-width: 768px) {
        .jumbotron h1 {
          font-size: 2rem;
        }

        iframe {
          height: 350px;
        }

        .nav-tabs .nav-link {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="kontener">
      <header>
        <div class="jumbotron text-center">
          <h1>Wynajem garażowych miejsc parkingowych</h1>
        </div>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
          <li class="nav-item">
            <a
              class="nav-link active"
              id="home-tab"
              data-toggle="tab"
              href="#home"
              role="tab"
              aria-controls="home"
              aria-selected="true"
              >Strona główna</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              id="profile-tab"
              data-toggle="tab"
              href="#profile"
              role="tab"
              aria-controls="profile"
              aria-selected="false"
              >Wolne miejsca</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              id="contact-tab"
              data-toggle="tab"
              href="#contact"
              role="tab"
              aria-controls="contact"
              aria-selected="false"
              >Konto</a
            >
          </li>
        </ul>
      </header>

      <main class="tab-content" id="myTabContent">
        <iframe
          src="strona_g.html"
          frameborder="0"
          class="tab-pane fade show active"
          id="home"
          role="tabpanel"
          aria-labelledby="home-tab"
        ></iframe>

        <iframe
          src="miejsca.php"
          class="tab-pane fade"
          id="profile"
          role="tabpanel"
          aria-labelledby="profile-tab"
          frameborder="0"
        ></iframe>

        <iframe
          src="konto.php"
          class="tab-pane fade"
          id="contact"
          role="tabpanel"
          aria-labelledby="contact-tab"
          frameborder="0"
        ></iframe>
      </main>
    </div>
  </body>
</html>
